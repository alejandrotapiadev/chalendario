# Sirve el build estático y reescribe /api/... hacia la API quitando el prefijo, igual que
# el proxy de Vite en desarrollo (apps/web/vite.config.ts). `api` es el nombre del servicio
# en docker-compose.prod.yml; cambia el `proxy_pass` si se despliega de otra forma.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
